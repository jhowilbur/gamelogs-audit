[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamelogs-audit"
version = "0.1.0"
description = "Integrity checks for the CNeuroMod videogame datasets, from public files only"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
gamelogs-audit = "gamelogs_audit.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
